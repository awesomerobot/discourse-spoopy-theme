<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 150">
  <style>
    .nbd-splash-moon { fill: var(--primary); }
    .nbd-splash-glow-stop { stop-color: var(--primary); }
    .nbd-splash-moon-texture { fill: var(--secondary); opacity: 0.13; }
    .nbd-splash-pocks { opacity: 0.8; }
    .nbd-splash-sky-grain { fill: var(--primary); opacity: 0.12; }
    .nbd-splash-crater { fill: var(--secondary); opacity: 0.07; }
    .nbd-splash-branch { fill: none; stroke: var(--secondary); stroke-linecap: round; stroke-linejoin: round; }
    .nbd-splash-star { fill: var(--primary); animation: nbd-splash-twinkle 2.4s ease-in-out infinite; }
    .nbd-splash-star:nth-of-type(2) { animation-delay: -0.8s; }
    .nbd-splash-star:nth-of-type(3) { animation-delay: -1.6s; }
    .nbd-splash-bat { fill: var(--secondary); }
    .nbd-splash-bat--big { animation: nbd-splash-fly 3.2s ease-in-out infinite; }
    .nbd-splash-bat--small { animation: nbd-splash-fly-back 4.1s ease-in-out -1.4s infinite; }
    .nbd-splash-wings { opacity: 0; animation: 0.3s linear infinite; }
    .nbd-splash-wings--up { animation-name: nbd-splash-up; }
    .nbd-splash-wings--mid { animation-name: nbd-splash-mid; }
    .nbd-splash-wings--down { animation-name: nbd-splash-down; }
    .nbd-splash-bat--small .nbd-splash-wings { animation-duration: 0.24s; }

    @keyframes nbd-splash-fly {
      0% { transform: translate(20px, 70px) scale(0.42); }
      25% { transform: translate(80px, 46px) scale(0.42) rotate(-6deg); }
      50% { transform: translate(120px, 64px) scale(0.42) rotate(5deg); }
      75% { transform: translate(160px, 40px) scale(0.42) rotate(-4deg); }
      100% { transform: translate(250px, 58px) scale(0.42); }
    }
    @keyframes nbd-splash-fly-back {
      0% { transform: translate(230px, 34px) scale(-0.28, 0.28); }
      30% { transform: translate(170px, 54px) scale(-0.28, 0.28) rotate(6deg); }
      60% { transform: translate(110px, 30px) scale(-0.28, 0.28) rotate(-5deg); }
      100% { transform: translate(-10px, 48px) scale(-0.28, 0.28); }
    }
    @keyframes nbd-splash-up { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes nbd-splash-mid { 0%, 24.9%, 50%, 74.9% { opacity: 0; } 25%, 49.9%, 75%, 100% { opacity: 1; } }
    @keyframes nbd-splash-down { 0%, 49.9%, 75%, 100% { opacity: 0; } 50%, 74.9% { opacity: 1; } }
    @keyframes nbd-splash-twinkle { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.2; } }

    @media (prefers-reduced-motion: reduce) {
      .nbd-splash-bat, .nbd-splash-wings, .nbd-splash-star { animation: none; }
      .nbd-splash-wings--mid { opacity: 1; }
      .nbd-splash-bat--big { transform: translate(100px, 50px) scale(0.42); }
      .nbd-splash-bat--small { transform: translate(170px, 40px) scale(-0.28, 0.28); }
    }
  </style>

  <defs>
    <radialGradient id="nbd-splash-glow">
      <stop offset="0.6" class="nbd-splash-glow-stop" stop-opacity="0.16"/>
      <stop offset="0.75" class="nbd-splash-glow-stop" stop-opacity="0.07"/>
      <stop offset="1" class="nbd-splash-glow-stop" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="nbd-splash-moon-clip">
      <circle cx="125" cy="75" r="46"/>
    </clipPath>
    <filter id="nbd-splash-soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

